# Builds Virtus on a macOS runner and uploads it to TestFlight. No Xcode needed on your own Mac.
#
# One-time setup (see docs/testflight.md): four repository secrets
#   APPSTORE_ISSUER_ID, APPSTORE_KEY_ID, APPSTORE_PRIVATE_KEY (the .p8 file's contents), APPLE_TEAM_ID
# Run it from the Actions tab (Run workflow), or push a tag like v1.0.
name: iOS

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight
        type: boolean
        default: true
      id_prefix:
        description: Bundle id prefix (bundle id = <prefix>.Virtus)
        type: string
        default: com.jasonmiller
  push:
    tags: ["v*"]

# App Store Connect only accepts apps built with the iOS 26 SDK (Xcode 26 or later), and actool needs a
# simulator runtime that matches the chosen Xcode. So pick the newest Xcode 26 installed, else the newest 16.
env:
  PICK_XCODE: |
    xc=$(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -V | tail -1)
    [ -n "$xc" ] || xc=$(ls -d /Applications/Xcode_16.*.app 2>/dev/null | sort -V | tail -1)
    if [ -n "$xc" ]; then sudo xcode-select -s "$xc"; fi
    xcodebuild -version | tr '\n' ' '; echo
    ls -d /Applications/Xcode*.app | tr '\n' ' '; echo

jobs:
  check:
    name: Type-check, self-test, renders
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: eval "$PICK_XCODE"
      - run: Tools/check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: renders
          path: |
            build/selftest/*.png
            build/selftest/artwork-coverage.csv
            build/selftest/store/**

  testflight:
    name: Archive and upload to TestFlight
    needs: check
    if: ${{ github.event_name == 'push' || inputs.upload }}
    runs-on: macos-15
    env:
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ID_PREFIX: ${{ inputs.id_prefix || 'com.jasonmiller' }}
    steps:
      - uses: actions/checkout@v4
      - run: eval "$PICK_XCODE"

      - name: Check the secrets are set
        run: |
          mkdir -p build
          missing=""
          [ -n "$KEY_ID" ] || missing="$missing APPSTORE_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing APPSTORE_ISSUER_ID"
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "${{ secrets.APPSTORE_PRIVATE_KEY }}" ] || missing="$missing APPSTORE_PRIVATE_KEY"
          echo "xcode: $(xcodebuild -version | tr '\n' ' ')" > build/setup.log
          echo "missing secrets:${missing:- none}" >> build/setup.log
          cat build/setup.log
          [ -z "$missing" ] || { echo "::error::missing secrets:$missing (see docs/testflight.md)"; exit 1; }

      - name: Install the App Store Connect API key
        env:
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$PRIVATE_KEY" > ~/private_keys/AuthKey_$KEY_ID.p8
          chmod 600 ~/private_keys/AuthKey_$KEY_ID.p8

      - name: Inspect the app ids and drop stale Xcode-managed profiles
        run: |
          python3 -m venv build/venv 2>&1 | tee -a build/setup.log
          build/venv/bin/pip install -q pyjwt cryptography 2>&1 | tee -a build/setup.log
          build/venv/bin/python - <<'PY' 2>&1 | tee -a build/setup.log
          import jwt, time, os, json, urllib.request
          key_id, iss, prefix = os.environ["KEY_ID"], os.environ["ISSUER_ID"], os.environ["ID_PREFIX"]
          key = open(os.path.expanduser(f"~/private_keys/AuthKey_{key_id}.p8")).read()
          tok = jwt.encode({"iss": iss, "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": key_id})
          def call(path, method="GET"):
              r = urllib.request.Request("https://api.appstoreconnect.apple.com" + path, method=method,
                                         headers={"Authorization": "Bearer " + tok})
              with urllib.request.urlopen(r) as resp:
                  body = resp.read()
                  return json.loads(body) if body else {}
          for bid in [f"{prefix}.Virtus", f"{prefix}.Virtus.Widget"]:
              data = call(f"/v1/bundleIds?filter[identifier]={bid}")["data"]
              if not data:
                  print(f"app id {bid}: NOT REGISTERED"); continue
              caps = call(f"/v1/bundleIds/{data[0]['id']}/bundleIdCapabilities")["data"]
              print(f"app id {bid}: capabilities", [c["attributes"]["capabilityType"] for c in caps])
              for c in caps:
                  if c["attributes"]["capabilityType"] == "APP_GROUPS":
                      print(f"   app groups settings: {json.dumps(c['attributes'].get('settings'))}")
          profiles = call("/v1/profiles?limit=200")["data"]
          for p in profiles:
              name = p["attributes"]["name"]
              if "Virtus" in name:
                  print("profile:", name, p["attributes"]["profileState"], "-> deleting so Xcode regenerates it")
                  try: call(f"/v1/profiles/{p['id']}", "DELETE")
                  except Exception as e: print("   could not delete:", e)
          PY

      - name: Archive (cloud-managed signing)
        run: |
          xcodebuild -project Virtus.xcodeproj -scheme Virtus -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Virtus.xcarchive archive \
            -allowProvisioningUpdates -allowProvisioningDeviceRegistration \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            VIRTUS_ID_PREFIX="$ID_PREFIX" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            2>&1 | tee build/archive.log | grep -E "error:|warning: .*sign|\*\* ARCHIVE" || true
          if grep -q "application-groups entitlement" build/archive.log; then
            echo "::error::The App Group group.$ID_PREFIX.Virtus is not assigned to both app ids in your developer account. See docs/testflight.md step 1."
          fi
          test -d build/Virtus.xcarchive || { echo "::error::archive failed, see the archive log artifact"; exit 1; }

      - name: Upload to App Store Connect
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Virtus.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee build/export.log | grep -E "error|Error|Upload|EXPORT" || true
          grep -q "EXPORT SUCCEEDED" build/export.log || { echo "::error::upload failed, see the export log artifact"; exit 1; }
          echo "Build $GITHUB_RUN_NUMBER uploaded. It appears in App Store Connect > TestFlight after processing (10-30 min)."

      - name: Remove the API key
        if: always()
        run: rm -rf ~/private_keys

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: build/*.log

  report:
    name: Copy logs and renders to the ci-results branch
    needs: [check, testflight]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Push the results
        run: |
          mkdir -p out
          {
            echo "run: $GITHUB_RUN_NUMBER  id: $GITHUB_RUN_ID  ref: $GITHUB_REF_NAME  commit: ${GITHUB_SHA::7}"
            echo "check: ${{ needs.check.result }}"
            echo "testflight: ${{ needs.testflight.result }}"
            echo "url: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > out/STATUS.txt
          cat out/STATUS.txt
          cd out
          git init -q -b ci-results
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -qm "Run $GITHUB_RUN_NUMBER: check ${{ needs.check.result }}, testflight ${{ needs.testflight.result }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY" ci-results
